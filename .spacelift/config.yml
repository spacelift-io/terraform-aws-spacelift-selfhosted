version: 2

# Note: the module version here is just used to run tests via the Spacelift private module registry.
# The value can be changed as needed and doesn't need to match the tagged module version.
module_version: "2.0.0"

tests:
  - name: Custom VPC
    project_root: examples/custom-vpc
    environment:
      TF_VAR_aws_region: eu-north-1

  - name: Custom S3 retention
    project_root: examples/custom-s3-retention
    environment:
      TF_VAR_aws_region: eu-north-1

  - name: SQS Enabled
    project_root: examples/sqs-enabled
    environment:
      TF_VAR_aws_region: eu-north-1

  - name: Without ECR
    project_root: examples/without-ecr
    environment:
      TF_VAR_aws_region: eu-north-1
    after_apply:
      # With create_container_registry = false the ECR outputs are null and
      # the shell output has no image lines.
      - |
        set -eu
        TF_BIN=$(command -v tofu || command -v terraform || true)
        for b in /bin/tofu /bin/terraform; do [ -n "$TF_BIN" ] || { [ -x "$b" ] && TF_BIN=$b; }; done
        [ -n "$TF_BIN" ] && [ -x "$TF_BIN" ] || { echo "ER10-CHECK FAIL: no tofu or terraform binary"; exit 1; }
        ALL=$($TF_BIN output -json)
        SHELL_OUT=$($TF_BIN output -raw shell)
        echo "$SHELL_OUT"
        # Proves the state was read: a known output must be there.
        echo "$ALL" | grep -q '"binaries_bucket_name"' || { echo "ER10-CHECK FAIL: binaries_bucket_name missing, state not read"; exit 1; }
        echo "$SHELL_OUT" | grep -q "BINARIES_BUCKET_NAME" || { echo "ER10-CHECK FAIL: the shell output misses BINARIES_BUCKET_NAME"; exit 1; }
        # Null outputs are not stored in the state, so a null output is a missing one.
        if echo "$ALL" | grep -q '"ecr_backend_repository_url"'; then
          echo "ER10-CHECK FAIL: ecr_backend_repository_url is not null"; exit 1
        fi
        if echo "$SHELL_OUT" | grep -qE "BACKEND_IMAGE|LAUNCHER_IMAGE|PRIVATE_ECR_LOGIN_URL"; then
          echo "ER10-CHECK FAIL: the shell output has image lines"; exit 1
        fi
        echo "ER10-CHECK OK: $TF_BIN, checked $(echo "$SHELL_OUT" | grep -c export) shell lines, no ECR outputs, no image lines"
